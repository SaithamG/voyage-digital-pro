<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A0202E"/>
      <stop offset="100%" style="stop-color:#5A0F1D"/>
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="16" cy="16" r="9.5"/>
    </clipPath>
  </defs>

  <!-- Fond arrondi bordeaux -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Globe — cercle principal -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#C9A227" stroke-width="1.4"/>

  <!-- Méridien vertical -->
  <line x1="16" y1="6.5" x2="16" y2="25.5" stroke="#C9A227" stroke-width="1" opacity="0.7" clip-path="url(#circle-clip)"/>

  <!-- Équateur horizontal -->
  <line x1="6.5" y1="16" x2="25.5" y2="16" stroke="#C9A227" stroke-width="1" opacity="0.7" clip-path="url(#circle-clip)"/>

  <!-- Parallèle supérieur (courbé) -->
  <path d="M 7.2 11.5 Q 16 9.5 24.8 11.5" fill="none" stroke="#C9A227" stroke-width="0.9" opacity="0.6" clip-path="url(#circle-clip)"/>

  <!-- Parallèle inférieur (courbé) -->
  <path d="M 7.2 20.5 Q 16 22.5 24.8 20.5" fill="none" stroke="#C9A227" stroke-width="0.9" opacity="0.6" clip-path="url(#circle-clip)"/>

  <!-- Point central doré -->
  <circle cx="16" cy="16" r="1.8" fill="#C9A227"/>
</svg>
